name: Repository Validation

on:
  push:
  pull_request:

jobs:
  validate-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required files and folders
        run: |
          test -f README.md
          test -d docs
          test -f .gitignore
          echo "Repository validation completed successfully."
